name: Build and Release fitwithRahul APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Clean Android Engine generate karega aur Kotlin version 1.9.24 me set karega
      - name: Setup Android & Update Kotlin Version
        run: |
          rm -rf android
          flutter create --platforms=android --org=com.fitwithrahul --project-name=fitwith_rahul .
          
          # settings.gradle me agar kotlin plugin hai toh 1.9.24 replace karega
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          fi

          # build.gradle me agar ext.kotlin_version hai toh 1.9.24 replace karega
          if [ -f android/build.gradle ]; then
            sed -i -E "s/ext.kotlin_version = '[^']+'/ext.kotlin_version = '1.9.24'/" android/build.gradle
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: fitwithRahul App v1.0.0 (Build #${{ github.run_number }})
          body: |
            ## fitwithRahul Official Release
            - 3, 4, ya 5 Meal Flexible Diet Planner
            - Built-in Food & Hypertrophy Workout Protocol
            - WhatsApp PDF Sharing with @fitwithRahul Instagram Link
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
