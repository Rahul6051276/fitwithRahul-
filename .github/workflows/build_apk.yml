name: Build and Release fitwithRahul APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed/Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Setup & Build fitwithRahul App
        run: |
          # 1. Fresh Project banayega
          flutter create --org com.fitwithrahul --project-name fitwith_rahul fit_build_temp
          
          # 2. Files and Assets copy honge
          cp -r lib fit_build_temp/
          cp -r assets fit_build_temp/
          cp pubspec.yaml fit_build_temp/pubspec.yaml
          
          # 3. Permissions inject
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' fit_build_temp/android/app/src/main/AndroidManifest.xml
          
          # 4. Duplicate Class Fix
          cat << 'EOF' >> fit_build_temp/android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          if (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8') {
                              details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                          }
                      }
                  }
              }
          }
          EOF

          # 5. Build Run
          cd fit_build_temp
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp fit_build_temp/build/app/outputs/flutter-apk/app-release.apk release_apk/fitwithRahul-Release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: fitwithRahul App v1.0.0 (Build #${{ github.run_number }})
          body: |
            ## fitwithRahul Official Release
            * Authentic Coach Profile Integration
            * Unit-based Diet Planner (gm, tbsp, tsp, piece)
            * Hypertrophy Workout Protocol (Sets/Reps/Rest)
            * Client Local Save/History Persistence
            * Branded WhatsApp PDF Export (@fitwithRahul)
          files: release_apk/fitwithRahul-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
