name: Build and Release fitwithRahul APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Configure Android Engine & Force SDK 34
        run: |
          rm -rf android
          flutter create --platforms=android --org=com.fitwithrahul --project-name=fitwith_rahul .

          # 1. Update Kotlin to 1.9.24 in settings.gradle
          sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle

          # 2. Fix subprojects compileSdk to 34 via gradle initialization hook
          mkdir -p android/gradle/init.d
          cat << 'EOF' > android/gradle/init.d/fix-sdk.gradle
          allprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin("com.android.application") ||
                      project.plugins.hasPlugin("com.android.library")) {
                      project.android {
                          compileSdkVersion 34
                          buildToolsVersion "34.0.0"
                      }
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: fitwithRahul App v1.0.0 (Build #${{ github.run_number }})
          body: |
            ## fitwithRahul Official Release
            - Gram-based (gm) Dynamic Diet Planner
            - Auto Macro Calculation with Food Icons
            - Branded WhatsApp PDF Export
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
