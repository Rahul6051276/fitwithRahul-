name: Build and Release fitwithRahul APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Android Structure & Clean Gradle Config
        run: |
          rm -rf android
          flutter create --platforms=android --org=com.fitwithrahul --project-name=fitwith_rahul .
          
          # Android SDK version 34 set karna app build.gradle me
          sed -i -E 's/compileSdk = [0-9]+/compileSdk = 34/' android/app/build.gradle 2>/dev/null || true
          sed -i -E 's/compileSdkVersion [0-9]+/compileSdkVersion 34/' android/app/build.gradle 2>/dev/null || true
          sed -i -E 's/targetSdk = [0-9]+/targetSdk = 34/' android/app/build.gradle 2>/dev/null || true
          sed -i -E 's/targetSdkVersion [0-9]+/targetSdkVersion 34/' android/app/build.gradle 2>/dev/null || true

          # Kotlin version ko 1.9.24 align karna (declarative settings.gradle me)
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: fitwithRahul App v1.0.0 (Build #${{ github.run_number }})
          body: |
            ## fitwithRahul Official Release
            - Gram-based (gm) Dynamic Diet Planner
            - Auto Macro Calculation with Food Icons
            - Branded WhatsApp PDF Export
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
